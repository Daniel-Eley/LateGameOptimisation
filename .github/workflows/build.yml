name: Diagnostics checks
on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow tests only the pure C# statistics, not the game integration.
# It cannot publish releases or modify repository contents.
permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/DiagnosticsTests.csproj --configuration Release
